<svg width="100%" height="160" viewBox="0 0 1000 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="1000" height="160" rx="14" fill="url(#bg-grad)"/>
  <rect width="1000" height="160" rx="14" stroke="url(#accent-grad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Accent Line -->
  <rect x="24" y="0" width="952" height="3" rx="1.5" fill="url(#accent-grad)"/>

  <!-- Window controls decoration -->
  <circle cx="36" cy="30" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="52" cy="30" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="68" cy="30" r="5" fill="#22c55e" opacity="0.8"/>

  <!-- Title & Subtitle -->
  <text x="500" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    Yoel Solórzano
  </text>
  <text x="500" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#c084fc" letter-spacing="0.5">
    Systems Engineering Student  •  Aspiring Full Stack Developer
  </text>
  <text x="500" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    📍 Trujillo, Perú  •  Web Development, Software &amp; Databases
  </text>
</svg>
