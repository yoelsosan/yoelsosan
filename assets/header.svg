<svg width="100%" height="180" viewBox="0 0 1000 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0914"/>
      <stop offset="50%" stop-color="#120D24"/>
      <stop offset="100%" stop-color="#1B1238"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Radial Glow in the center -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8B5CF6" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Main Card Background -->
  <rect width="1000" height="180" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Dot Grid Overlay -->
  <rect width="1000" height="180" rx="16" fill="url(#dot-grid)"/>

  <!-- Center Ambient Glow -->
  <rect width="1000" height="180" rx="16" fill="url(#center-glow)"/>

  <!-- Card Border -->
  <rect width="1000" height="180" rx="16" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Top Glowing Accent Bar -->
  <rect x="20" y="0" width="960" height="3" rx="1.5" fill="url(#accent-bar)"/>

  <!-- Window Control Dots (macOS style) -->
  <circle cx="38" cy="28" r="5" fill="#EF4444" opacity="0.85"/>
  <circle cx="54" cy="28" r="5" fill="#F59E0B" opacity="0.85"/>
  <circle cx="70" cy="28" r="5" fill="#10B981" opacity="0.85"/>

  <!-- Decorative Status Tag on Right -->
  <rect x="850" y="20" width="112" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="864" cy="31" r="3.5" fill="#10B981"/>
  <text x="874" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#C4B5FD" letter-spacing="0.5">
    PORTFOLIO
  </text>

  <!-- Title: Yoel Solórzano -->
  <text x="500" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">
    Yoel Solórzano
  </text>

  <!-- Subtitle: Role & Track -->
  <text x="500" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#C4B5FD" letter-spacing="1">
    FULL STACK DEVELOPER  •  SYSTEMS ENGINEERING
  </text>

  <!-- Tagline: Core Tech Focus -->
  <text x="500" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="0.4">
    Laravel &nbsp;•&nbsp; PHP &nbsp;•&nbsp; Python &nbsp;•&nbsp; JavaScript &nbsp;•&nbsp; MySQL &nbsp;•&nbsp; Architecture &amp; APIs
  </text>
</svg>
